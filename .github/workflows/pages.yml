name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fetch pinned pdf.js (no install scripts)
        run: |
          set -euo pipefail
          PDFJS_VERSION=4.10.38
          mkdir "$RUNNER_TEMP/pdfjs"
          cd "$RUNNER_TEMP/pdfjs"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact "pdfjs-dist@${PDFJS_VERSION}"
          npm ls pdfjs-dist

      - name: Assemble site
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/pdfjs/node_modules/pdfjs-dist"
          mkdir -p site/vendor
          cp web/index.html web/app.js web/styles.css web/service-worker.js web/conversion-layout.mjs site/
          cp "$SRC/legacy/build/pdf.min.mjs" "$SRC/legacy/build/pdf.worker.min.mjs" site/vendor/
          cp -r "$SRC/cmaps" site/vendor/cmaps
          cp "$SRC/LICENSE" site/vendor/LICENSE
          # Use a unique cache namespace and asset URLs for every deployed revision.
          sed -i "s/__APP_VERSION__/${GITHUB_SHA}/g" site/index.html site/service-worker.js

      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          node --check site/app.js
          node --check site/service-worker.js
          node --check site/conversion-layout.mjs
          node --test web/tests/conversion-layout.test.mjs

      - name: Safety checks and file fingerprints
        run: |
          set -euo pipefail
          grep -q "Content-Security-Policy" site/index.html
          test -f site/service-worker.js
          test -f site/conversion-layout.mjs
          grep -q "serviceWorker.register" site/app.js
          grep -q "pdftoword-offline-${GITHUB_SHA}" site/service-worker.js
          grep -q "app.js?v=${GITHUB_SHA}" site/index.html
          if grep -q "__APP_VERSION__" site/index.html site/service-worker.js; then
            echo "::error::Unsubstituted application version token"; exit 1
          fi
          if grep -Eq '(src|href)="https?:' site/index.html; then
            echo "::error::External resource found in index.html"; exit 1
          fi
          if grep -Eq 'fetch\(|XMLHttpRequest|WebSocket|sendBeacon' site/app.js; then
            echo "::error::Network call found in app.js"; exit 1
          fi
          echo "### Site file SHA-256" >> "$GITHUB_STEP_SUMMARY"
          (cd site && find . -type f ! -path './vendor/cmaps/*' -exec sha256sum {} \; | sort -k2) | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4