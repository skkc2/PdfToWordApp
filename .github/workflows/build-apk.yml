- name: Run Python script to generate Android project
  run: |
    if [ -f "build_pdf_to_word_app.py" ]; then
      python3 build_pdf_to_word_app.py
    else
      python3 PdfToWordApp/build_pdf_to_word_app.py
    fi

- name: Set up JDK 17
  uses: actions/setup-java@v4
  with:
    distribution: 'temurin'
    java-version: '17'

- name: Setup Gradle
  uses: gradle/actions/setup-gradle@v4
  with:
    gradle-version: '8.10.2'

- name: Run Unit Tests and Build Debug APK
  working-directory: ./PdfToWordApp
  run: gradle testDebugUnitTest assembleDebug

- name: Upload Compiled APK Artifact
  uses: actions/upload-artifact@v4
  with:
    name: Offline-PdfToWord-APK
    path: PdfToWordApp/app/build/outputs/apk/debug/app-debug.apk