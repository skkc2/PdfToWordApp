name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate Android project
        run: python3 build_pdf_to_word_app.py

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Run unit tests and build APK
        working-directory: PdfToWordApp
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Verify APK is permission-free and not debuggable
        working-directory: PdfToWordApp
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          echo "Using: $AAPT2"

          "$AAPT2" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -q '^package:' /tmp/permissions.txt
          BAD=$(grep '^uses-permission' /tmp/permissions.txt | grep -v 'DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Unexpected permissions found:"
            echo "$BAD"
            exit 1
          fi

          "$AAPT2" dump badging "$APK" > /tmp/badging.txt
          if grep -q 'application-debuggable' /tmp/badging.txt; then
            echo "::error::APK is debuggable"
            exit 1
          fi

          echo "OK: no unexpected permissions, not debuggable"
          echo "APK SHA-256:" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Offline-PdfToWord-APK
          path: PdfToWordApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14